# Write the files the website reads. Nothing runs on a server: the site is
# rebuilt from these files whenever the pipeline runs.
MODEL: etl
VERSION: "1.0.0"
CONFIG:
  inputs:
    municipalities: {format: s3, path: "{{ env.WORK_DIR }}/analysed/municipalities.parquet", file_format: parquet}
    projects: {format: s3, path: "{{ env.WORK_DIR }}/analysed/projects.parquet", file_format: parquet}
    meta: {format: s3, path: "{{ env.WORK_DIR }}/analysed/meta.parquet", file_format: parquet}
    stations: {format: s3, path: "{{ env.WORK_DIR }}/analysed/stations.parquet", file_format: parquet}
    wards: {format: s3, path: "{{ env.WORK_DIR }}/analysed/wards.parquet", file_format: parquet}
    geographies: {format: s3, path: "{{ env.WORK_DIR }}/raw/geographies.parquet", file_format: parquet}
  outputs:
    municipalities: {format: s3, path: "{{ env.SITE_DATA }}/municipalities.json", file_format: json, mode: overwrite}
    projects: {format: s3, path: "{{ env.SITE_DATA }}/projects.json", file_format: json, mode: overwrite}
    boundaries: {format: s3, path: "{{ env.SITE_DATA }}/boundaries.json", file_format: json, mode: overwrite}
    stations: {format: s3, path: "{{ env.SITE_DATA }}/stations.json", file_format: json, mode: overwrite}
    wards: {format: s3, path: "{{ env.SITE_DATA }}/wards.json", file_format: json, mode: overwrite}
    meta: {format: s3, path: "{{ env.SITE_DATA }}/meta.json", file_format: json, mode: overwrite}
