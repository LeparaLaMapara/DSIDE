# The live layer, run every few hours: Tshwane's open electricity faults and
# how long they take to fix, news headlines that name a place, and Eskom's
# loadshedding stage. Reads the published schools and wards; writes small
# JSON files the site fetches.
MODEL: etl
VERSION: "1.0.0"
CONFIG:
  inputs:
    schools: {format: s3, path: "{{ env.SITE_DATA }}/schools.json", file_format: json, options: {multiLine: true}}
  outputs:
    faults: {format: site_json, path: "{{ env.LIVE_DIR }}/faults.json", mode: overwrite}
    fault_wards: {format: site_json, path: "{{ env.LIVE_DIR }}/fault_wards.json", mode: overwrite}
    news: {format: site_json, path: "{{ env.LIVE_DIR }}/news.json", mode: overwrite}
    status: {format: site_json, path: "{{ env.LIVE_DIR }}/status.json", mode: overwrite}
  # Checked by the Ubunye Engine before the files are written, as warnings
  # only: the live layer must always publish, and one odd answer (Eskom says
  # -1, "unknown", at times) must never hold back the news and the faults.
  # Loadshedding stages run 0 to 8; a blank stage means Eskom is not saying.
  expectations:
    status:
      rules:
        - {row_count: {min: 1, max: 1}, severity: warn}
        - {between: {column: stage, min: 0, max: 8}, severity: warn}
    faults:
      rules:
        - {not_null: code, severity: warn}
        - {not_null: ward_id, severity: warn}
        - {between: {column: open_hours, min: 0}, severity: warn}
    fault_wards:
      rules:
        - {unique: [code, ward_id], severity: warn}
    news:
      rules:
        - {not_null: code, severity: warn}
        - {unique: url, severity: warn}
