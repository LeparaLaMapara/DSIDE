[project]
name = "dside-engine"
version = "1.0.0"
description = "Masepala data layer: public South African municipal data turned into plain-language facts, built on the Ubunye Engine."
requires-python = ">=3.11"
dependencies = [
  # 0.7 is the first release with the pandas backend; transforms get plain DataFrames.
  "ubunye-engine[pandas]>=0.7,<0.8",
  "httpx>=0.27",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "openpyxl>=3.1",
  "lxml>=5",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "feedparser>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."ubunye.readers"]
treasury_cube = "dside_engine.connectors:TreasuryCubeReader"
treasury_facts = "dside_engine.connectors:TreasuryFactsReader"
wazimap_indicator = "dside_engine.connectors:WazimapIndicatorReader"
wazimap_geography = "dside_engine.connectors:WazimapGeographyReader"
vulekamali_projects = "dside_engine.connectors:VulekamaliProjectsReader"
saps_crime = "dside_engine.connectors:SapsCrimeReader"
statssa_qlfs = "dside_engine.connectors:QlfsReader"
mdb_wards = "dside_engine.connectors:WardReader"
ward_councillors = "dside_engine.connectors:CouncillorReader"
dside_source = "dside_engine.connectors:DsideSourceReader"

[project.entry-points."ubunye.writers"]
site_json = "dside_engine.connectors:SiteJsonWriter"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dside_engine*"]
