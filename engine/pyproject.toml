[project]
name = "dside-engine"
version = "1.0.0"
description = "DSIDE data layer: public South African municipal data turned into plain-language facts, built on the Ubunye Engine."
requires-python = ">=3.11"
dependencies = [
  # Pinned to the pandas backend commit (PR #51) until it ships in a release.
  "ubunye-engine[pandas,rest] @ git+https://github.com/ubunye-ai-ecosystems/ubunye_engine@c6ceb07d6c323da826e3b6e2c84500484790e1de",
  "httpx>=0.27",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "openpyxl>=3.1",
  "lxml>=5",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "feedparser>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."ubunye.readers"]
treasury_cube = "dside_engine.connectors:TreasuryCubeReader"
treasury_facts = "dside_engine.connectors:TreasuryFactsReader"
wazimap_indicator = "dside_engine.connectors:WazimapIndicatorReader"
wazimap_geography = "dside_engine.connectors:WazimapGeographyReader"
vulekamali_projects = "dside_engine.connectors:VulekamaliProjectsReader"
saps_crime = "dside_engine.connectors:SapsCrimeReader"
statssa_qlfs = "dside_engine.connectors:QlfsReader"
mdb_wards = "dside_engine.connectors:WardReader"
ward_councillors = "dside_engine.connectors:CouncillorReader"
dside_source = "dside_engine.connectors:DsideSourceReader"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dside_engine*"]
